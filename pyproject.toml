[project]
name = "autoevolve"
version = "0.1.0"
description = "Agent-native evolutionary optimization. Say the goal in english, evolve code toward it with a population of coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "RightNow AI" }]
keywords = [
    "evolutionary-optimization",
    "code-optimization",
    "agents",
    "mcp",
    "llm",
    "program-synthesis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "mcp>=1.10",
    "httpx>=0.27",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pillow>=10.4",
]

[project.urls]
Homepage = "https://github.com/RightNow-AI/autoevolve"
Repository = "https://github.com/RightNow-AI/autoevolve"
Issues = "https://github.com/RightNow-AI/autoevolve/issues"
Documentation = "https://github.com/RightNow-AI/autoevolve/tree/main/docs"

[project.optional-dependencies]
# GPU evaluators declare their own hardware needs in spec.md. Triton has no
# universal wheel story, so it is never a default dependency. CI stays CPU-mocked.
gpu = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
autoevolve = "autoevolve.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoevolve"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
